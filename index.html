<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E4E8C">
  <title>三用電表專業英文課堂｜中正高工資訊科</title>
  <meta name="description" content="高雄中正高工資訊科吳東儒老師：三用電表與基本電性量測互動課堂">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
        </div>
        <div>
          <h1>三用電表英文課</h1>
          <p id="who" aria-live="polite">尚未報到</p>
        </div>
      </div>
      <div class="topbar-progress">
        <div class="progress-track" id="progTrack" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="課堂完成度">
          <div class="progress-fill" id="progFill"></div>
        </div>
        <div class="help" id="progLabel" aria-live="polite">完成 0%</div>
        <div class="help save-ok" id="saveState">打了就會自動存</div>
      </div>
    </header>
    <main id="app"></main>
    <nav class="dock" aria-label="課堂導覽">
      <button type="button" data-nav="home" aria-label="開始">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20H4V10.5Z"/></svg>
        開始
      </button>
      <button type="button" data-nav="hub" aria-label="關卡列表">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 21V4h9l-1 4h6l-2 5H8"/></svg>
        關卡
      </button>
      <button type="button" data-nav="vocab" aria-label="詞彙">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5V6.5A2.5 2.5 0 0 1 6.5 4H20v13H6.5A2.5 2.5 0 0 0 4 19.5Z"/></svg>
        詞彙
      </button>
      <button type="button" data-nav="measure" aria-label="量測">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
        量測
      </button>
      <button type="button" data-nav="submit" aria-label="交給老師">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"/></svg>
        交給老師
      </button>
    </nav>
    <p class="footer-note">
      <span>高雄市立中正高工　資訊科　吳東儒</span>
      <a href="teacher.html">教師審核台</a>
    </p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/content.js"></script>
  <script src="js/store.js"></script>
  <script src="js/score.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
